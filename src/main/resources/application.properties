server.port=0

# ===== 本地幂等事件接入配置（全部为本地文件/进程内组件，无外部依赖）=====
# 事件记录存储目录
app.ingestion.data-dir=${java.io.tmpdir}/idempotent-ingestion/events
# 模拟下游落地区目录
app.ingestion.downstream-data-dir=${java.io.tmpdir}/idempotent-ingestion/downstream
# 最大投递尝试次数（含首次），超过后进入失败区
app.ingestion.max-attempts=3
# 指数退避：第 n 次重试等待 min(base * 2^(n-1), max)
app.ingestion.backoff-base-millis=200
app.ingestion.backoff-max-millis=5000
# 测试环境可关闭抖动以获得确定性时序
app.ingestion.retry-jitter=true
# 重试扫描周期
app.ingestion.scan-interval-millis=200
