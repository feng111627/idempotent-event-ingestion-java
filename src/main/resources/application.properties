# 服务端口（0 表示随机端口，本地验证时可固定为 8080）
server.port=8080

# 事件状态日志（本地追加式文件，重启后重放恢复；不依赖外部服务）
ingestion.store.journal-path=data/event-journal.jsonl

# 重试与退避策略：最多尝试 maxAttempts 次，
# 第 n 次重试前退避 initialBackoffMs * backoffMultiplier^(n-1) 毫秒
ingestion.retry.max-attempts=3
ingestion.retry.initial-backoff-ms=100
ingestion.retry.backoff-multiplier=2.0
